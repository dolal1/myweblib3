services:
  db:
    image: postgres:18-alpine
    container_name: myweblib3-db
    # Deliberately not `unless-stopped`: that policy brings the container back
    # every time the Docker daemon starts, so the database of a project nobody
    # is working on sits there holding a port and a few hundred MB of RAM until
    # someone stops it by hand. scripts/with-db.sh starts these on demand and
    # stops them again, so the project owns nothing while it is idle.
    restart: "no"
    environment:
      POSTGRES_USER: myweblib
      POSTGRES_PASSWORD: myweblib
      POSTGRES_DB: myweblib3
    ports:
      # Published port comes from .env, which compose reads automatically; see
      # the note on DB_PORT there.
      - "${DB_PORT:-15433}:5432"
    volumes:
      # Postgres 18 images want a single mount at /var/lib/postgresql and place
      # the cluster in a version-specific subdirectory, so that `pg_upgrade
      # --link` does not cross a mount boundary. Mounting .../data instead makes
      # the container refuse to start.
      - db-data:/var/lib/postgresql
    healthcheck:
      # Without this, `docker compose up -d` returns before Postgres accepts
      # connections and the first `prisma migrate` of a session fails.
      test: ["CMD-SHELL", "pg_isready -U myweblib -d myweblib3"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Throwaway database for integration tests. tmpfs-backed so it is fast and
  # leaves nothing behind between runs.
  db-test:
    image: postgres:18-alpine
    container_name: myweblib3-db-test
    restart: "no"
    environment:
      POSTGRES_USER: myweblib
      POSTGRES_PASSWORD: myweblib
      POSTGRES_DB: myweblib3_test
    ports:
      - "${DB_TEST_PORT:-15434}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myweblib -d myweblib3_test"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db-data:
