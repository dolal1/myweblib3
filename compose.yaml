services:
  db:
    image: postgres:18-alpine
    container_name: myweblib3-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: myweblib
      POSTGRES_PASSWORD: myweblib
      POSTGRES_DB: myweblib3
    ports:
      - "5433:5432"
    volumes:
      # Postgres 18 images want a single mount at /var/lib/postgresql and place
      # the cluster in a version-specific subdirectory, so that `pg_upgrade
      # --link` does not cross a mount boundary. Mounting .../data instead makes
      # the container refuse to start.
      - db-data:/var/lib/postgresql
    healthcheck:
      # Without this, `docker compose up -d` returns before Postgres accepts
      # connections and the first `prisma migrate` of a session fails.
      test: ["CMD-SHELL", "pg_isready -U myweblib -d myweblib3"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Throwaway database for integration tests. tmpfs-backed so it is fast and
  # leaves nothing behind between runs.
  db-test:
    image: postgres:18-alpine
    container_name: myweblib3-db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: myweblib
      POSTGRES_PASSWORD: myweblib
      POSTGRES_DB: myweblib3_test
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myweblib -d myweblib3_test"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db-data:
