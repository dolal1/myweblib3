name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check, test, audit, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # The npm bundled with Node 24 predates allowScripts and would run every
      # install script. npm 12 enforces the pinned list in package.json, as it
      # does locally (ADR-004).
      - run: npm install -g npm@12.0.1
      - run: npm ci

      # Same as the README's Getting started: real random secrets, never committed.
      - name: Create .env
        run: |
          cp .env.example .env
          sed -i "s|^SESSION_SECRET=.*|SESSION_SECRET=\"$(openssl rand -base64 32)\"|" .env
          sed -i "s|^CRON_SECRET=.*|CRON_SECRET=\"$(openssl rand -base64 32)\"|" .env

      - run: npx prisma generate
      - run: npm run check
      # Starts the tmpfs test database in Docker, migrates it, runs vitest.
      - run: npm test
      # ADR-004: production advisories fail the build.
      - run: npm audit --omit=dev
      - run: scripts/with-db.sh db npm run build

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@12.0.1
      - run: npm ci
      - name: Create .env
        run: |
          cp .env.example .env
          sed -i "s|^SESSION_SECRET=.*|SESSION_SECRET=\"$(openssl rand -base64 32)\"|" .env
          sed -i "s|^CRON_SECRET=.*|CRON_SECRET=\"$(openssl rand -base64 32)\"|" .env
      - run: npx prisma generate
      - run: npx playwright install --with-deps chromium
      # Seeds db-test, builds, and serves on :3100; see playwright.config.ts.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
