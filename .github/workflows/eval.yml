name: Smart search eval

# Replays the recorded API responses in evals/nl-search/recordings through the
# production interpreter. No API key, no network, no cost. Fails if the prompt,
# schema or model changed since the recordings were made, or if the pass rate
# drops below the threshold in cases.json. See evals/nl-search/run.mts.

# Manual only until the live recordings are committed (see the README's
# "How it was verified"). With no recordings every case is "missing", so on
# push it could only ever fail. Restore the push and pull_request triggers
# in the same commit as the recordings.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run eval:nl-search
